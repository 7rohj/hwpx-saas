spring.application.name=hwpx-saas
spring.main.web-application-type=servlet

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

logging.level.io.github.mumberrymountain=DEBUG
logging.level.com.khwajeong=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.com.khwajeong.hwpx_saas=DEBUG

# server.port=8080
server.port=${PORT:8080}

# SQLite DB 파일 위치(프로젝트 루트 기준)
spring.datasource.url=jdbc:sqlite:storage/db/hwpx.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# (선택) SQLite는 외래키 기본 OFF인 경우가 있어서 켜줌
spring.jpa.properties.hibernate.connection.foreign_keys=true

# 테이블/컬럼이 없으면 만들고, 있으면 유지
# spring.jpa.hibernate.ddl-auto=update

# 매번 테이블 새로 생성
# spring.jpa.hibernate.ddl-auto=create

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs
