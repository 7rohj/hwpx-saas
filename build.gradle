plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.khwajeong'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

bootJar {
    archiveFileName = "hwpx-exporter-cli.jar"
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	implementation "io.github.mumberrymountain:hwpxtemplater:0.1.0-local"

	implementation 'software.amazon.awssdk:s3:2.30.31'
	implementation 'software.amazon.awssdk:url-connection-client:2.30.31'
	implementation 'software.amazon.awssdk:apache-client:2.30.31'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.xerial:sqlite-jdbc:3.46.0.0'
	implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.4.Final'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
}

tasks.named('test') {
	useJUnitPlatform()
}
